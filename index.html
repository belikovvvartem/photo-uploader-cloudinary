<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Photo Uploader</title>
  <style>
        @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap');

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: "Comfortaa", sans-serif;
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      text-align: center;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
      max-width: 400px;
      width: 100%;
      position: relative;
    }

    h1 {
      margin-bottom: 20px;
    }

    .upload-area {
      border: 2px dashed #007bff;
      padding: 40px;
      border-radius: 10px;
      cursor: pointer;
      position: relative;
      transition: 0.3s;
    }

    .upload-area.ready {
      border-color: #28a745;
    }

    .upload-area::before {
      content: '+';
      font-size: 48px;
      color: #007bff;
      display: block;
      transition: 0.3s;
    }

    .upload-area.ready::before {
      content: '✓';
      color: #28a745;
    }

    /* Лічильник */
    .file-count {
      position: absolute;
      top: 10px;
      right: 10px;
      background-color: #28a745;
      color: white;
      font-size: 14px;
      padding: 2px 8px;
      border-radius: 12px;
      display: none;
    }

    .upload-area.ready .file-count {
      display: inline-block;
    }

    #fileInput {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #0056b3;
    }

    #result {
      margin-top: 20px;
    }

    .loader {
      margin: 20px auto;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #007bff;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    a {
      color: #007bff;
      word-break: break-word;
    }

    .toast {
      position: absolute;
      top: 20px;
      right: 20px;
      background-color: #28a745;
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      font-size: 14px;
      opacity: 0;
      transform: translateY(-20px);
      transition: opacity 0.4s ease, transform 0.4s ease;
      z-index: 1000;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Кнопка очищення */
    .clear-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background-color: #dc3545;
      color: white;
      border: none;
      padding: 5px 10px;
      font-size: 14px;
      border-radius: 6px;
      cursor: pointer;
      display: none;
    }

    .clear-btn.show {
      display: inline-block;
    }

    .clear-btn:hover {
      background-color: #a71d2a;
    }
  </style>
</head>
<body>
    <button class="clear-btn" id="clearBtn" onclick="clearResults()">Очистити</button>
    <div class="container">
        <h1>Завантажте фото</h1>
    
        <div class="upload-area" id="dropArea">
          <span class="file-count" id="fileCount"></span>
          <input type="file" id="fileInput" accept="image/*" multiple/>
        </div>
    
        <button onclick="uploadImage()">Отримати посилання</button>
        <div id="loader" style="display:none;" class="loader"></div>
        <div id="result"></div>
        <div id="toast" class="toast">Скопійовано!</div>
      </div>
      

  <script>
    const fileInput = document.getElementById('fileInput');
    const dropArea = document.getElementById('dropArea');
    const fileCount = document.getElementById('fileCount');
    const toast = document.getElementById('toast');
    const clearBtn = document.getElementById('clearBtn');

    function updateFileCount() {
      const count = fileInput.files.length;
      if (count > 0) {
        fileCount.textContent = count;
        dropArea.classList.add('ready');
      } else {
        fileCount.textContent = '';
        dropArea.classList.remove('ready');
      }
    }

    fileInput.addEventListener('change', updateFileCount);

    dropArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropArea.style.backgroundColor = "#eef6ff";
    });

    dropArea.addEventListener('dragleave', () => {
      dropArea.style.backgroundColor = "transparent";
    });

    dropArea.addEventListener('drop', (e) => {
      e.preventDefault();
      fileInput.files = e.dataTransfer.files;
      dropArea.style.backgroundColor = "transparent";
      updateFileCount();
    });

    async function uploadImage() {
      if (!fileInput.files.length) {
        alert('Завантажте фото!');
        return;
      }

      const formData = new FormData();
      [...fileInput.files].slice(0, 15).forEach(file => formData.append('file', file));

      document.getElementById('loader').style.display = 'block';
      document.getElementById('result').innerHTML = '';

      try {
        const response = await fetch('/api/upload', { method: 'POST', body: formData });
        const data = await response.json();
        const resultDiv = document.getElementById('result');

        if (response.ok && data.urls) {
          resultDiv.innerHTML = data.urls.map(url => `
            <p><strong>Link:</strong> <a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a></p>
            <button onclick="copyToClipboard('${url}')">Копіювати</button>
          `).join('');
          clearBtn.classList.add('show');
        } else {
          resultDiv.textContent = 'Помилка: ' + (data.error || 'Невідома помилка');
        }
      } catch (err) {
        document.getElementById('result').textContent = 'Помилка при запиті';
      } finally {
        document.getElementById('loader').style.display = 'none';
      }
    }

    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        showToast();
      });
    }

    function showToast() {
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    function clearResults() {
      document.getElementById('result').innerHTML = '';
      fileInput.value = '';
      updateFileCount();
      clearBtn.classList.remove('show');
    }
  </script>
</body>
</html>
