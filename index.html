<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Photo Uploader</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap');

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: "Comfortaa", sans-serif;
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      text-align: center;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
      max-width: 520px;
      width: 100%;
      position: relative;
    }

    h1 {
      margin-bottom: 20px;
      font-size: 20px;
    }

    .upload-area {
      border: 2px dashed #007bff;
      padding: 36px;
      border-radius: 10px;
      cursor: pointer;
      position: relative;
      transition: 0.3s;
    }

    .upload-area.ready {
      border-color: #28a745;
    }

    .upload-area::before {
      content: '+';
      font-size: 44px;
      color: #007bff;
      display: block;
      transition: 0.3s;
    }

    .upload-area.ready::before {
      content: '✓';
      color: #28a745;
    }

    .file-count {
      position: absolute;
      top: 8px;
      right: 10px;
      background-color: #28a745;
      color: white;
      font-size: 13px;
      padding: 3px 8px;
      border-radius: 12px;
      display: none;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    .upload-area.ready .file-count {
      display: inline-block;
    }

    #fileInput {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    button.primary {
      margin-top: 14px;
      padding: 10px 20px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 15px;
      cursor: pointer;
    }

    button.primary:hover {
      background-color: #0056b3;
    }

    #result {
      margin-top: 18px;
      display: flex;
      flex-direction: column;
      text-align: left;
      overflow: auto;
    }

    .loader {
      margin: 14px auto;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #007bff;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      animation: spin 1s linear infinite;
      display: none;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    a {
      color: #007bff;
      word-break: break-word;
    }

    .toast {
      position: fixed;
      top: 18px;
      right: 18px;
      background-color: #28a745;
      color: white;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 13px;
      opacity: 0;
      transform: translateY(-12px);
      transition: all .35s;
      z-index: 2000;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .clear-btn {
      position: fixed;
      top: 15px;
      right: 15px;
      background-color: #dc3545;
      color: white;
      border: none;
      padding: 7px 12px;
      font-size: 14px;
      border-radius: 6px;
      cursor: pointer;
      z-index: 2000;
      opacity: 0.9;
    }

    .clear-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .file-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 12px;
      font-size: 14px;
      padding: 8px;
      background: #f8f9fa;
      border-radius: 6px;
    }

    .file-status {
      font-size: 13px;
      color: #666;
      margin-left: auto;
    }

    .link-btn {
      padding: 4px 8px;
      border-radius: 4px;
      border: none;
      background: #007bff;
      color: #fff;
      cursor: pointer;
      font-size: 13px;
    }

    .link-btn:hover {
      background: #0056b3;
    }
  </style>
</head>

<body>
  <button class="clear-btn" id="clearBtn" onclick="clearResults()" disabled>Очистити</button>

  <div class="container">
    <h1>Завантажте фото</h1>

    <div class="upload-area" id="dropArea">
      <span class="file-count" id="fileCount"></span>
      <input type="file" id="fileInput" accept="image/*" multiple />
    </div>

    <button class="primary" id="uploadBtn" onclick="uploadImage()">Отримати посилання</button>
    <div id="loader" class="loader"></div>

    <div id="result"></div>
    <div id="toast" class="toast">Скопійовано!</div>
  </div>

  <script>
    const MAX_FILES = 10;
    const fileInput = document.getElementById('fileInput');
    const dropArea = document.getElementById('dropArea');
    const fileCount = document.getElementById('fileCount');
    const resultDiv = document.getElementById('result');
    const loader = document.getElementById('loader');
    const toast = document.getElementById('toast');
    const clearBtn = document.getElementById('clearBtn');
    const uploadBtn = document.getElementById('uploadBtn');

    function updateFileCount() {
      const count = fileInput.files.length;
      fileCount.textContent = count > 0 ? count : '';
      dropArea.classList.toggle('ready', count > 0);
    }

    fileInput.addEventListener('change', function () {
      if (this.files.length > MAX_FILES) {
        alert(`Можна завантажити максимум ${MAX_FILES} фото!`);
        this.value = '';
      }
      updateFileCount();
    });

    dropArea.addEventListener('dragover', e => {
      e.preventDefault();
      dropArea.style.backgroundColor = "#eef6ff";
    });
    dropArea.addEventListener('dragleave', () => {
      dropArea.style.backgroundColor = "transparent";
    });
    dropArea.addEventListener('drop', e => {
      e.preventDefault();
      fileInput.files = e.dataTransfer.files;
      dropArea.style.backgroundColor = "transparent";
      updateFileCount();
    });

    function resizeImageIfNeeded(file, maxWidth = 1600, quality = 0.8) {
      return new Promise(resolve => {
        if (!file.type.startsWith('image/')) return resolve(file);

        const reader = new FileReader();
        reader.onload = ev => {
          const img = new Image();
          img.onload = () => {
            if (img.width <= maxWidth) return resolve(file);

            const ratio = maxWidth / img.width;
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(img.width * ratio);
            canvas.height = Math.round(img.height * ratio);
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(blob => {
              const newName = file.name.replace(/\.[^/.]+$/, ".jpg");
              resolve(new File([blob], newName, { type: 'image/jpeg' }));
            }, 'image/jpeg', quality);
          };
          img.onerror = () => resolve(file);
          img.src = ev.target.result;
        };
        reader.onerror = () => resolve(file);
        reader.readAsDataURL(file);
      });
    }

    async function uploadSingleFile(file, idx) {
      const row = document.createElement('div');
      row.className = 'file-row';
      row.innerHTML = `<span>${idx + 1}.</span><strong>${file.name}</strong><span class="file-status">Чекає...</span>`;
      resultDiv.appendChild(row);

      try {
        row.querySelector('.file-status').textContent = 'Оптимізація...';
        const optimizedFile = await resizeImageIfNeeded(file);

        row.querySelector('.file-status').textContent = 'Отримання дозволу на завантаження...';

        const apiResp = await fetch(
          `/api/upload?filename=${encodeURIComponent(optimizedFile.name)}&contentType=${encodeURIComponent(optimizedFile.type)}`
        );
        const apiJson = await apiResp.json();

        if (!apiResp.ok) {
          row.querySelector('.file-status').textContent = `Помилка: ${apiJson.error || apiResp.status}`;
          return null;
        }

        const { signedUrl, url: publicUrl } = apiJson;

        row.querySelector('.file-status').textContent = 'Завантаження в Cloudflare R2...';

        const uploadResp = await fetch(signedUrl, {
          method: 'PUT',
          body: optimizedFile,
          headers: {
            'Content-Type': optimizedFile.type,
          },
        });

        if (!uploadResp.ok) {
          const errorText = await uploadResp.text();
          console.error('R2 upload error:', uploadResp.status, errorText);
          row.querySelector('.file-status').textContent = 'Помилка завантаження';
          return null;
        }

        row.querySelector('.file-status').innerHTML = `Готово <button class="link-btn" onclick="copyToClipboard('${publicUrl}')">Копіювати</button>`;

        const linkElem = document.createElement('div');
        linkElem.style.marginTop = '6px';
        linkElem.style.width = '100%';
        linkElem.innerHTML = `<a href="${publicUrl}" target="_blank" rel="noopener">${publicUrl}</a>`;
        row.appendChild(linkElem);

        return publicUrl;
      } catch (err) {
        console.error('Upload error:', err);
        row.querySelector('.file-status').textContent = 'Помилка мережі або сервера';
        return null;
      }
    }

    async function uploadImage() {
      if (!fileInput.files.length) {
        alert('Завантажте фото!');
        return;
      }

      uploadBtn.disabled = true;
      loader.style.display = 'block';
      resultDiv.innerHTML = '';
      clearBtn.disabled = true;

      const files = [...fileInput.files].slice(0, MAX_FILES);
      const urls = [];

      for (let i = 0; i < files.length; i++) {
        const url = await uploadSingleFile(files[i], i);
        if (url) urls.push(url);
      }

      loader.style.display = 'none';
      uploadBtn.disabled = false;
      if (urls.length > 0) clearBtn.disabled = false;
    }

    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
      }).catch(() => {
        alert('Не вдалося скопіювати (спробуйте вручну)');
      });
    }

    function clearResults() {
      resultDiv.innerHTML = '';
      fileInput.value = '';
      updateFileCount();
      clearBtn.disabled = true;
    }

    // Ініціалізація
    updateFileCount();
  </script>
</body>

</html>
