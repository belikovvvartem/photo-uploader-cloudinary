<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Photo Uploader</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #fff;
      color: #222;
    }
    h1 {
      margin-bottom: 20px;
      color: #007bff;
    }
    input[type="file"] {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      margin-top: 10px;
      padding: 10px 20px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    #result {
      margin-top: 20px;
      max-width: 90vw;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <h1>Upload your photo</h1>
  <input type="file" id="fileInput" accept="image/*" />
  <button onclick="uploadImage()">Upload</button>
  <div id="result"></div>

  <script>
    async function uploadImage() {
      const fileInput = document.getElementById('fileInput');
      if (!fileInput.files.length) {
        alert('Please select a file!');
        return;
      }
      const file = fileInput.files[0];
      const formData = new FormData();
      formData.append('file', file);

      const response = await fetch('/api/upload', {
        method: 'POST',
        body: formData,
      });

      const data = await response.json();

      const resultDiv = document.getElementById('result');
      if (response.ok && data.url) {
        resultDiv.innerHTML = `
          <p><strong>Link:</strong> <a href="${data.url}" target="_blank" rel="noopener noreferrer">${data.url}</a></p>
          <button onclick="copyToClipboard('${data.url}')">Copy Link</button>
        `;
      } else {
        resultDiv.textContent = 'Upload failed: ' + (data.error || 'Unknown error');
      }
    }

    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        alert('Copied to clipboard!');
      });
    }
  </script>
</body>
</html>
