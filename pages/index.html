<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Photo Uploader → Cloudflare R2</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap');
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0; font-family: "Comfortaa", sans-serif;
      background: #f8f9fa; display: flex; justify-content: center; align-items: center;
      min-height: 100vh;
    }
    .container {
      background: white; padding: 30px; border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1); max-width: 520px; width: 100%;
    }
    h1 { font-size: 22px; text-align: center; margin-bottom: 20px; }
    .upload-area {
      border: 2px dashed #007bff; padding: 40px; border-radius: 10px;
      text-align: center; cursor: pointer; position: relative; transition: 0.3s;
    }
    .upload-area.ready { border-color: #28a745; }
    .upload-area::before { content: '+'; font-size: 50px; color: #007bff; display: block; }
    .upload-area.ready::before { content: '✓'; color: #28a745; }
    .file-count {
      position: absolute; top: 8px; right: 10px; background: #28a745;
      color: white; padding: 4px 10px; border-radius: 20px; font-size: 14px; display: none;
    }
    .upload-area.ready .file-count { display: block; }
    #fileInput { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    button.primary {
      width: 100%; margin-top: 20px; padding: 12px; background: #007bff;
      color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer;
    }
    button.primary:hover { background: #0056b3; }
    button.primary:disabled { background: #6c757d; cursor: not-allowed; }
    .loader {
      border: 4px solid #f3f3f3; border-top: 4px solid #007bff;
      border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite;
      margin: 20px auto; display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #result { margin-top: 20px; }
    .file-row {
      background: #f1f3f5; padding: 10px; border-radius: 8px; margin-bottom: 10px;
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px;
    }
    .file-status { margin-left: auto; color: #666; }
    .link-btn {
      background: #007bff; color: white; border: none; padding: 5px 10px;
      border-radius: 4px; cursor: pointer; font-size: 13px;
    }
    .link-btn:hover { background: #0056b3; }
    .toast {
      position: fixed; top: 20px; right: 20px; background: #28a745; color: white;
      padding: 12px 20px; border-radius: 6px; opacity: 0; transition: 0.3s;
    }
    .toast.show { opacity: 1; }
    .clear-btn {
      position: fixed; top: 20px; right: 20px; background: #dc3545; color: white;
      border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer;
    }
    .clear-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    a { color: #007bff; word-break: break-all; }
  </style>
</head>
<body>
  <button class="clear-btn" id="clearBtn" onclick="clearResults()" disabled>Очистити</button>

  <div class="container">
    <h1>Завантажте фото в Cloudflare R2</h1>

    <div class="upload-area" id="dropArea">
      <span class="file-count" id="fileCount"></span>
      <input type="file" id="fileInput" accept="image/*" multiple />
    </div>

    <button class="primary" id="uploadBtn" onclick="uploadImage()">Отримати посилання</button>
    <div id="loader" class="loader"></div>
    <div id="result"></div>
    <div id="toast" class="toast">Скопійовано!</div>
  </div>

  <script>
    const MAX_FILES = 10;
    const fileInput = document.getElementById('fileInput');
    const dropArea = document.getElementById('dropArea');
    const fileCount = document.getElementById('fileCount');
    const resultDiv = document.getElementById('result');
    const loader = document.getElementById('loader');
    const toast = document.getElementById('toast');
    const clearBtn = document.getElementById('clearBtn');
    const uploadBtn = document.getElementById('uploadBtn');

    function updateFileCount() {
      const count = fileInput.files.length;
      fileCount.textContent = count || '';
      dropArea.classList.toggle('ready', count > 0);
    }

    fileInput.addEventListener('change', () => {
      if (fileInput.files.length > MAX_FILES) {
        alert(`Максимум ${MAX_FILES} файлів!`);
        fileInput.value = '';
      }
      updateFileCount();
    });

    dropArea.addEventListener('dragover', e => { e.preventDefault(); dropArea.style.background = '#eef6ff'; });
    dropArea.addEventListener('dragleave', () => dropArea.style.background = '');
    dropArea.addEventListener('drop', e => {
      e.preventDefault();
      dropArea.style.background = '';
      fileInput.files = e.dataTransfer.files;
      updateFileCount();
    });

    function resizeImageIfNeeded(file, maxWidth = 1600, quality = 0.85) {
      return new Promise(resolve => {
        if (!file.type.startsWith('image/')) return resolve(file);
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            if (img.width <= maxWidth) return resolve(file);
            const canvas = document.createElement('canvas');
            const ratio = maxWidth / img.width;
            canvas.width = img.width * ratio;
            canvas.height = img.height * ratio;
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            canvas.toBlob(blob => {
              const newFile = new File([blob], file.name.replace(/\.[^/.]+$/, ".jpg"), { type: 'image/jpeg' });
              resolve(newFile);
            }, 'image/jpeg', quality);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function uploadSingleFile(file, idx) {
      const row = document.createElement('div');
      row.className = 'file-row';
      row.innerHTML = `<strong>${idx + 1}. ${file.name}</strong><span class="file-status">Чекає...</span>`;
      resultDiv.appendChild(row);

      try {
        row.querySelector('.file-status').textContent = 'Стискаємо...';
        const optimized = await resizeImageIfNeeded(file);

        row.querySelector('.file-status').textContent = 'Отримуємо дозвіл...';
        const res = await fetch(`/api/upload?filename=${encodeURIComponent(optimized.name)}&contentType=${encodeURIComponent(optimized.type)}`);
        const data = await res.json();

        if (!res.ok) throw new Error(data.error || 'Помилка сервера');

        row.querySelector('.file-status').textContent = 'Завантажуємо в R2...';
        const uploadRes = await fetch(data.signedUrl, {
          method: 'PUT',
          body: optimized,
          headers: { 'Content-Type': optimized.type }
        });

        if (!uploadRes.ok) throw new Error('Не вдалося завантажити');

        const url = data.url;
        row.querySelector('.file-status').innerHTML = `Готово <button class="link-btn" onclick="copy('${url}')">Копіювати</button>`;
        row.innerHTML += `<div style="width:100%; margin-top:8px;"><a href="${url}" target="_blank">${url}</a></div>`;

      } catch (err) {
        row.querySelector('.file-status').textContent = 'Помилка: ' + err.message;
      }
    }

    async function uploadImage() {
      if (!fileInput.files.length) return alert('Виберіть фото!');

      uploadBtn.disabled = true;
      loader.style.display = 'block';
      resultDiv.innerHTML = '';
      clearBtn.disabled = true;

      const files = Array.from(fileInput.files).slice(0, MAX_FILES);

      for (let i = 0; i < files.length; i++) {
        await uploadSingleFile(files[i], i);
      }

      loader.style.display = 'none';
      uploadBtn.disabled = false;
      clearBtn.disabled = false;
    }

    function copy(text) {
      navigator.clipboard.writeText(text);
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function clearResults() {
      resultDiv.innerHTML = '';
      fileInput.value = '';
      updateFileCount();
      clearBtn.disabled = true;
    }

    updateFileCount();
  </script>
</body>
</html>
